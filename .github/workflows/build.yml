name: Android-App

# Baut MdEdit als APK. Auf main wird die APK als Release "android-latest" veröffentlicht,
# auf anderen Branches nur als Build-Artefakt zum Prüfen.
on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gradle-Wrapper prüfen
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk mdedit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mdedit-apk
          path: mdedit.apk

      - name: Als Release veröffentlichen (nur main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest mdedit.apk --prerelease --title "MdEdit für Android (Build ${{ github.run_number }})" \
            --notes "APK zum direkten Installieren. Version 1.0.${{ github.run_number }}, Stand ${{ github.sha }}."
